[package]
name = "aike_browser"
version = "0.1.0"
edition = "2024"

[lib]
name = "browser"
crate-type = ["cdylib"]

[dependencies]
zuqe_zapi = { path = "../zuqe-zapi", features = ["serde_json_support"] }
zuqe_zapi_macros = { path = "../zuqe-zapi-macros" }
serde_json = "1"
base64 = "0.22"
crossbeam-channel = "0.5"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "net",
    "time",
    "process",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
] }
futures-util = "0.3"
log = "0.4"
