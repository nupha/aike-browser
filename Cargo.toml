[package]
name = "aike_browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "CDP-driven Chrome automation as a zapi native extension for the aike runtime"
authors = ["John Ray <996351336@qq.com>"]
license = "Apache-2.0"
readme = "README.md"
keywords = ["chrome", "cdp", "automation", "aike"]
categories = ["development-tools::testing", "web-programming", "api-bindings"]
repository = "https://github.com/nupha/aike-browser"

[lib]
name = "browser"
crate-type = ["cdylib"]

[dependencies]
zuqe_zapi = { version = "0.4.0", features = ["serde_json_support"] }
zuqe_zapi_macros = "0.4.0"
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "net",
    "time",
    "process",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
] }
futures-util = "0.3"
log = "0.4"
